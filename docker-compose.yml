services:
  app:
    image: 192.168.1.117:5000/my-express/app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: my-express-app
    restart: unless-stopped
    shm_size: "512m"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DBF_ROOT_PATH=/data/express
      - DBF_SNAPSHOT_ROOT_PATH=/data/express-snapshot
      - DBF_DATA_PATH=/data/express/ThongTha
      - AUTH_TRUST_HOST=true
      - PORT=3000
    volumes:
      # Production parent path mounted via CIFS over Tailscale (contains all Express companies)
      - ${HOST_DBF_ROOT:-/mnt/express}:/data/express:ro
      # PVE local snapshot/backup path (read-only)
      - ${HOST_DBF_SNAPSHOT_ROOT:-/mnt/backup/my-express/current}:/data/express-snapshot:ro
